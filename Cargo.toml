[workspace]
members = [ 
    "benches", 

    "crates/cc_qol_utils", 
    "crates/cc_math_utils", 
    "crates/cc_matrix_utils", 
    "crates/hilbert_space", 
    "crates/spin_algebra", 
    "crates/unit_systems",
    "crates/cc_propagator", 
    "crates/single_chan", 
    "crates/coupled_chan",
    "crates/cc_problems", 
    "crates/coupled_chan_cli"
, "crates/cc_derive"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rayon = "1.11.0"

num-complex = { version = "0.4.6", features = ["serde"]}
num-traits = "0.2.19"

anyhow = "1.0"

serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
dyn-clone = "1.0"

faer = "0.24"
nalgebra = "0.34"
ndarray = "0.16.1"

clebsch-gordan = { git = "https://github.com/Wleter/clebsch-gordan", features = ["serde"]}
cc_problems = { path = "crates/cc_problems" }

[profile.dev.package.faer]
opt-level = 3
